[pytest]
# Deux cycles distincts, parce qu'ils ne servent pas a la meme chose.
#
#   pytest                  cycle RAPIDE — 235 tests en 29 s, utilisable comme
#                           garde-fou de regression a chaque modification.
#   pytest -m lent          cycle LOURD — tests sur donnees reelles : 16,5 M de
#                           lignes de carnet, plusieurs minutes par fichier.
#   pytest -m ""            tout.
#
# Sans cette separation, un simple `pytest` prenait plus de dix minutes et
# n'etait donc jamais lance : un garde-fou qu'on n'utilise pas n'en est pas un.
addopts = -m "not lent"
markers =
    lent: touche le lac de donnees reel (DuckDB sur les instantanes de carnet)
testpaths = tests
